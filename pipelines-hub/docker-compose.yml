# Pipelines Hub en OrbStack:
#   docker compose up -d --build
#   → https://pipelines.orb.local   (o http://localhost:8095)
name: pipelines-hub

services:
  hub:
    build: .
    image: pipelines-hub:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8000"
    volumes:
      - hub-data:/data
      # Infraestructura: solo lectura. El panel usa tu kubeconfig/AWS para el visor de
      # Kubernetes y tus llaves SSH para monitorear servidores.
      - ${HOME}/.kube:/kube:ro
      - ${HOME}/.aws:/aws:ro
      - ${HOME}/.ssh:/ssh:ro
    environment:
      HUB_KUBECONFIG: /kube/config
      HUB_SSH_DIR: /ssh
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    env_file:
      - path: .env
        required: false
    labels:
      dev.orbstack.domains: pipelines.orb.local
      dev.orbstack.http-port: "8000"

volumes:
  hub-data:
