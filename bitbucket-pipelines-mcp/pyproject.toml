[tool.poetry]
name = "bitbucket-mcp"
version = "0.1.0"
description = "MCP server for Bitbucket Cloud - manage pipelines, pull requests, branches and repositories"
readme = "README.md"
license = "MIT"
authors = ["Felipe Vega"]
keywords = ["mcp", "bitbucket", "pipelines", "devops"]
packages = [{include = "bitbucket_mcp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastmcp = ">=3.0.0b1"
httpx = ">=0.28.1"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"

[tool.poetry.scripts]
bitbucket-mcp = "bitbucket_mcp:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
